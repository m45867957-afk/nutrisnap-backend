name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب پکیج‌ها
        run: npm ci

      # این ریپازیتوری باید فقط فایل‌های بک‌اند (Express) باشه، نه فرانت‌اند.
      # اگه App.jsx یا vite.config.js اینجا پیدا بشه، یعنی فایل‌ها قاطی شدن.
      - name: چک نبودن فایل‌های فرانت‌اند اینجا
        run: |
          if [ -f "App.jsx" ] || [ -f "vite.config.js" ] || [ -d "src" ]; then
            echo "❌ این ریپازیتوری بک‌اند است ولی فایل‌های فرانت‌اند (App.jsx / vite.config.js / src) در آن پیدا شد."
            echo "احتمالاً فایل‌ها بین دو ریپازیتوری قاطی شده‌اند."
            exit 1
          fi
          echo "✅ فایل فرانت‌اندی اینجا نیست."

      # مطمئن شو @sentry/node همیشه در package.json هست — دقیقاً همون باگی که قبلاً
      # باعث Exited with status 1 روی Render شد.
      - name: چک وجود @sentry/node در package.json
        run: |
          if ! grep -q '"@sentry/node"' package.json; then
            echo "❌ پکیج @sentry/node در package.json نیست — همون باگی که قبلاً کرش داد."
            exit 1
          fi
          echo "✅ @sentry/node در package.json هست."

      # چک نحو واقعی (نه فقط لینت) — جلوی باگ‌هایی مثل حذف تصادفی یه خط یا بریس ناقص رو می‌گیره.
      - name: چک نحو تمام فایل‌های .js
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./dist/*" \
            -print0 | xargs -0 -n1 node --check
          echo "✅ نحو همه‌ی فایل‌های js درست است."

      # اگر ریپازیتوری‌ات تست دارد، این خط آن را هم اجرا می‌کند؛ اگر نداری، بی‌خطر رد می‌شود.
      - name: اجرای تست‌ها (در صورت وجود)
        run: npm test --if-present
