<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriSnap — ابزار ادمین</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    max-width: 560px; margin: 40px auto; padding: 0 16px;
    background: #0f172a; color: #e2e8f0;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .sub { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 10px;
    padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-bottom: 8px;
  }
  .btn-grant { background: #16a34a; color: white; }
  .btn-revoke { background: #dc2626; color: white; }
  .btn-resync { background: #2563eb; color: white; }
  .btn-clear { background: transparent; color: #94a3b8; border: 1px solid #475569; }
  #log {
    background: #020617; border: 1px solid #334155; border-radius: 8px;
    padding: 12px; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap;
    max-height: 320px; overflow-y: auto; direction: ltr; text-align: left;
  }
  .warn { color: #fbbf24; font-size: 0.8rem; margin-top: 8px; }
  .hint { color: #64748b; font-size: 0.75rem; margin: -8px 0 12px; }
</style>
</head>
<body>

<h1>🛠 NutriSnap — ابزار ادمین</h1>
<div class="sub">این فایل را فقط در مرورگر واقعی (نه پیش‌نمایش داخلی چت) باز کنید.</div>

<div class="card">
  <label>آدرس بک‌اند</label>
  <input id="backendUrl" value="https://nutrisnap-backend-u5iv.onrender.com">

  <label>userId کاربر هدف (برای Grant / Revoke)</label>
  <input id="targetUserId" placeholder="u_33456d9356b2509f96002419">
  <div class="hint">
    userId رو از /usage/&lt;userId&gt; یا از خروجی resync پایین پیدا کن — سرور فقط userId می‌خواد، نه ایمیل.
  </div>

  <button class="btn-grant" onclick="callAdmin('/admin/grant-premium', { userId: val('targetUserId') })">
    ✅ Premium کردن کاربر
  </button>
  <button class="btn-revoke" onclick="callAdmin('/admin/revoke-premium', { userId: val('targetUserId') })">
    ❌ Revoke کردن
  </button>
  <button class="btn-resync" onclick="callAdmin('/admin/resync-subscriptions', {})">
    🔄 بازسازی اشتراک‌ها از Stripe
  </button>
  <button class="btn-clear" onclick="clearSecret()">
    🔓 پاک کردن سکرت ذخیره‌شده (خروج)
  </button>

  <div class="warn">⚠️ سکرت فقط در sessionStorage همین تب نگه داشته می‌شود و با بستن تب پاک می‌شود.</div>
</div>

<div class="card">
  <label>خروجی</label>
  <div id="log">آماده...</div>
</div>

<script>
  function val(id) { return document.getElementById(id).value.trim(); }
  function log(msg) {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    el.textContent = `[${time}] ${msg}\n\n` + el.textContent;
  }

  function getSecret() {
    let secret = sessionStorage.getItem('admin_secret');
    if (!secret) {
      secret = prompt('ADMIN_SECRET را وارد کنید:');
      if (secret) sessionStorage.setItem('admin_secret', secret);
    }
    return secret;
  }

  function clearSecret() {
    sessionStorage.removeItem('admin_secret');
    log('سکرت پاک شد. درخواست بعدی دوباره آن را می‌پرسد.');
  }

  // نکته‌ی مهم: سرور واقعی NutriSnap سکرت را از داخل body می‌خواند (نه از هدر)،
  // پس اینجا هم secret را داخل همان JSON body که به سرور می‌فرستیم می‌گذاریم.
  async function callAdmin(endpoint, extraBody) {
    const backend = val('backendUrl');
    if (!backend) { alert('آدرس بک‌اند را وارد کنید'); return; }

    if ('userId' in extraBody && !extraBody.userId) {
      log('❌ userId را وارد کنید.');
      return;
    }

    const secret = getSecret();
    if (!secret) { log('❌ سکرت وارد نشد، عملیات لغو شد.'); return; }

    log(`⏳ در حال ارسال درخواست به ${endpoint} ...`);
    try {
      const res = await fetch(backend + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...extraBody, secret })
      });

      const data = await res.json().catch(() => ({}));

      if (res.status === 403) {
        sessionStorage.removeItem('admin_secret');
        log('❌ سکرت اشتباه بود (403). دوباره امتحان کنید.');
        return;
      }
      if (res.status === 429) {
        log('❌ تعداد تلاش زیاد بوده، چند دقیقه صبر کنید (429).');
        return;
      }
      if (!res.ok) {
        log(`❌ خطا (${res.status}): ${JSON.stringify(data)}`);
        return;
      }

      log(`✅ موفق:\n${JSON.stringify(data, null, 2)}`);
    } catch (err) {
      log(`❌ Failed to fetch — مطمئن شوید این فایل در مرورگر واقعی (نه پیش‌نمایش چت) باز شده است.\n${err.message}`);
    }
  }
</script>

</body>
</html>
