name: CI Frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب پکیج‌ها
        run: npm ci

      # این ریپازیتوری باید فقط فایل‌های فرانت‌اند (Vite/React) باشه، نه بک‌اند.
      # اگه server.js یا instrument.js اینجا پیدا بشه، یعنی فایل‌ها قاطی شدن.
      - name: چک نبودن فایل‌های بک‌اند اینجا
        run: |
          if [ -f "server.js" ] || [ -f "instrument.js" ]; then
            echo "❌ این ریپازیتوری فرانت‌اند است ولی فایل‌های بک‌اند (server.js / instrument.js) در آن پیدا شد."
            echo "احتمالاً فایل‌ها بین دو ریپازیتوری قاطی شده‌اند."
            exit 1
          fi
          echo "✅ فایل بک‌اندی اینجا نیست."

      # مطمئن شو BACKEND_URL هیچ‌وقت به آدرس قدیمی Railway برنگشته (اشتباهی که قبلاً افتاد).
      - name: چک نبودن آدرس قدیمی Railway
        run: |
          if grep -rq "railway.app" --include="*.jsx" --include="*.js" .; then
            echo "❌ آدرس Railway هنوز جایی در کد هست — BACKEND_URL باید Render باشه."
            exit 1
          fi
          echo "✅ اثری از آدرس قدیمی Railway نیست."

      # بیلد واقعی Vite — اگه سینتکس یا importها خراب باشن، همین‌جا fail می‌شه
      # (این قوی‌تر از node --check است چون JSX را هم واقعاً کامپایل می‌کند).
      - name: بیلد Vite
        run: npm run build
